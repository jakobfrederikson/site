<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jakob Frederikson</title>
	<link rel="icon" type="image/x-icon" href="astronaut-helmet-favicon.png">
	<link rel="stylesheet" href="styles.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body>

	<main>
		<h1 class="courier-prime-bold">JAKOB FREDERIKSON</h1>
		<div class="courier-prime-regular">
			<span>
				<a href="https://github.com/jakobfrederikson" target="_blank">GitHub</a>
			</span>
			|
			<span>
				Aotearoa New Zealand
			</span>
			|
			<span>
				Programming Hobbyist
			</span>
		</div>

		<br/>

		<div class="courier-prime-regular">
			<h2>About</h2>
			<p>I enoy playing games, programming, cooking (although, I'm a picky eater), and reading. I'm quite introverted.</p>
		</div>

		<br/>

		<div class="courier-prime-regular">
			<div class="tab">
				<button id="defaultOpen" class="tab-links courier-prime-regular" onclick="openTab(event, 'readingList')"><h2>Reading</h2></button>
				<button class="tab-links courier-prime-regular" onclick="openTab(event, 'gamingList')"><h2>Favourite Games</h2></button>				
			</div>

			<div id="readingList" class="hobby-list">
			</div>

			<div id="gamingList" class="hobby-list">
			</div>
		</div>		
			
	</main>


	<script type="module" src="script.js"></script>

	<script>
		function openTab(event, hobby) {
			let tabContent = document.getElementsByClassName("hobby-list");
			for (let i = 0; i < tabContent.length; i++) {
				tabContent[i].style.display = "none";
			}

			let tabLinks = document.getElementsByClassName("tab-links");
			for (let i = 0; i < tabContent.length; i++) {
				tabLinks[i].className = tabLinks[i].className.replace(" active", " ");
			}

			document.getElementById(hobby).style.display = "block";
			event.currentTarget.className += " active";
		}

		document.getElementById("defaultOpen").click();
	</script>

</body>

</html>
